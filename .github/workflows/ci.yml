name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 回归测试（node:test，零依赖）
        run: node --test "tests/*.test.mjs"
      - name: 产物与源码快照不得漂移
        run: git diff --exit-code -- lib src
